[workspace]

[package]
name = "youtube-adapter-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
cockatiel-client = { git = "https://github.com/vulbyte/cockatiel_client-rs", rev = "a74ebf1e63784be39876a55cf3a963933220bf15" }
tokio = { version = "1.38", features = ["full"] }
tonic = { version = "0.12", features = ["transport", "tls", "tls-roots"] }
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
futures-util = "0.3"
tokio-tungstenite = "0.24"
open = "5.0"
uuid = { version = "1", features = ["v7"] }

[build-dependencies]
tonic-build = "0.12"
